<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐏 咩花糖的魔界歌單 ♪</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="icon.png" type="image/png">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        /* 改為深色與紫色漸層背景 */
        body { 
            font-family: 'Noto Sans TC', 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #2D2727 0%, #4D3C77 100%); 
            color: #EADBC8; 
            min-height: 100vh; 
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        /* 標題改為魔界風格 */
        .header { 
            text-align: center; 
            padding: 40px 20px; 
            background: linear-gradient(135deg, #9D76C1 0%, #711DB0 100%); 
            border-radius: 0 0 40px 40px; 
            box-shadow: 0 4px 30px rgba(113, 29, 176, 0.4); 
            margin-bottom: 30px;
            border-bottom: 3px solid #FFE69A;
        }
        .header h1 { 
            font-size: 2.2rem; 
            font-weight: 700; 
            color: #FFF; 
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }

        .section-card { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(10px);
            padding: 25px; 
            border-radius: 25px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.2); 
            margin-bottom: 25px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .search-input { 
            width: 100%; 
            padding: 12px 20px; 
            background: rgba(0,0,0,0.2);
            border: 2px solid #9D76C1; 
            color: white;
            border-radius: 15px; 
            margin-bottom: 15px; 
            outline: none; 
            transition: 0.3s; 
        }
        .search-input:focus { border-color: #FBCBF3; box-shadow: 0 0 15px rgba(251, 203, 243, 0.3); }
        
        .filter-btn { 
            padding: 8px 18px; 
            border: 2px solid #9D76C1; 
            background: transparent; 
            color: #FBCBF3; 
            border-radius: 25px; 
            cursor: pointer; 
            transition: all 0.3s; 
            font-weight: 600; 
        }
        .filter-btn.active { background: #9D76C1; color: white; border-color: #FFE69A; }

        .song-card { 
            background: rgba(255, 255, 255, 0.08); 
            border-radius: 20px; 
            padding: 25px; 
            transition: all 0.3s; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .song-card:hover { 
            transform: translateY(-8px); 
            background: rgba(255, 255, 255, 0.12);
            border-color: #FBCBF3; 
        }
        
        .song-name { color: #FFE69A; font-weight: 700; font-size: 1.1rem; }

        .request-btn { 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 15px; 
            background: linear-gradient(135deg, #9D76C1 0%, #FBCBF3 100%); 
            color: #2D2727; 
            font-weight: 800; 
            cursor: pointer; 
            margin-top: 15px; 
            transition: 0.3s; 
            box-shadow: 0 4px 15px rgba(157, 118, 193, 0.4); 
        }
        .request-btn:hover { filter: brightness(1.1); transform: scale(1.02); }

        .status-singing { 
            background: #FFE69A; 
            color: #2D2727; 
            animation: pulse 1.5s infinite; 
            border-radius: 10px; 
            padding: 4px 10px; 
            font-weight: 800; 
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.95); opacity: 0.8; } }

        .modal-content { 
            background: #2D2727; 
            color: #EADBC8;
            border: 2px solid #9D76C1;
            border-radius: 30px; 
            padding: 30px; 
        }
        .form-input { 
            background: rgba(0,0,0,0.3);
            color: white;
            border: 2px solid #4D3C77;
            border-radius: 15px;
        }
        
        .tag-chip { border-color: #4D3C77; color: #9D76C1; }
        .tag-checkbox:checked + .tag-chip { background: #9D76C1; color: white; }

        .toast { background: #FBCBF3; color: #2D2727; font-weight: bold; }
        
        /* 針對文字顏色的微調 */
        .text-pink-400 { color: #FBCBF3 !important; }
        .text-gray-400 { color: #A0937D !important; }
        .bg-pink-50 { background-color: rgba(157, 118, 193, 0.2) !important; }
        .text-pink-300 { color: #FFE69A !important; }
    </style>
</head>
<body>
    <div class="header">
        <h1 onclick="toggleMode()" style="cursor: default;">🐏 咩花糖的魔界歌單 ♪</h1>
    </div>
    <div class="container">
        <div id="audienceView">
            <div class="section-card">
                <h3 class="font-bold mb-3 text-pink-400 text-lg flex items-center">✨ 靈魂排隊中...</h3>
                <div id="queueList" class="space-y-2 text-gray-400">正在召喚名單...</div>
            </div>

            <div class="section-card bg-black/20">
                <h3 class="font-bold mb-3 text-gray-400 text-md flex items-center cursor-pointer" onclick="document.getElementById('doneList').classList.toggle('hidden')">
                    🌙 今日已獻唱歌曲 (展開/收合)
                </h3>
                <div id="doneList" class="grid grid-cols-2 md:grid-cols-4 gap-2 text-sm text-gray-400 hidden"></div>
            </div>

            <div class="section-card">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜尋歌名、歌手或魔界關鍵字...">
                <div id="filterButtons" class="flex gap-2 flex-wrap">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="中文歌">中文</button>
                    <button class="filter-btn" data-filter="日文歌">日文</button>
                    <button class="filter-btn" data-filter="英文歌">英文</button>
                </div>
            </div>

            <div class="songs-grid grid grid-cols-1 md:grid-cols-3 gap-6" id="songsGrid"></div>
        </div>

        <div id="managementView" style="display:none;">
            <div class="bg-gray-900 p-6 rounded-2xl mb-6 shadow-sm border border-purple-500 flex flex-wrap justify-between items-center gap-4">
                <div>
                    <h2 class="text-2xl font-bold text-purple-400">咩花糖大魔王後台 😈</h2>
                    <p class="text-xs text-gray-500">魔界數據同步中</p>
                </div>
                <div class="flex gap-2">
                    <button class="bg-gray-700 text-white px-4 py-2 rounded-xl text-sm font-bold" onclick="forceUpdate()">🔄 刷新</button>
                    <button class="bg-red-900 text-white px-4 py-2 rounded-xl text-sm font-bold" onclick="clearDoneQueue()">🗑️ 清空紀錄</button>
                    <button class="bg-purple-600 text-white px-4 py-2 rounded-xl text-sm font-bold" onclick="openSongModal()">新增歌曲 +</button>
                </div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-black/30 p-6 rounded-2xl shadow-sm border border-gray-800">
                    <h3 class="font-bold mb-4 border-b border-gray-700 pb-2 text-purple-300">📋 待唱祭品</h3>
                    <div id="adminQueueList" class="space-y-4"></div>
                </div>
                <div class="bg-black/30 p-6 rounded-2xl shadow-sm border border-gray-800">
                    <h3 class="font-bold mb-4 border-b border-gray-700 pb-2 text-purple-300">🎵 魔界曲庫</h3>
                    <div id="adminSongsList" class="space-y-1 text-sm overflow-y-auto max-h-[500px]"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="requestModal">
        <div class="modal-content">
            <h3 class="text-xl font-bold mb-2">點歌契約</h3>
            <p id="targetSongName" class="text-yellow-200 font-bold text-lg"></p>
            <input type="text" id="requesterName" class="form-input w-full p-3 mt-4" placeholder="你的靈魂真名 (暱稱)">
            <textarea id="requestMsg" class="form-input w-full p-3 mt-4 h-24" placeholder="想對咩花糖說的悄悄話..."></textarea>
            <button class="request-btn" id="confirmRequestBtn">簽署契約 (點歌) ♪</button>
            <button class="w-full mt-4 text-gray-500 text-sm" onclick="closeModals()">取消</button>
        </div>
    </div>

    <div class="modal" id="songEditModal">
        <div class="modal-content">
            <h3 class="text-xl font-bold mb-4">上傳魔界樂譜</h3>
            <input type="text" id="editName" class="form-input w-full p-3 mb-4" placeholder="歌名">
            <input type="text" id="editArtist" class="form-input w-full p-3 mb-4" placeholder="歌手">
            <div class="flex gap-2 mb-4">
                <label><input type="checkbox" class="tag-checkbox" value="中文歌"><span class="tag-chip p-2 px-4 border rounded-full">中文</span></label>
                <label><input type="checkbox" class="tag-checkbox" value="日文歌"><span class="tag-chip p-2 px-4 border rounded-full">日文</span></label>
            </div>
            <button class="request-btn" onclick="saveSong()">確認上架</button>
            <button class="w-full mt-4 text-gray-500 text-sm" onclick="closeModals()">取消</button>
        </div>
    </div>

    <div class="modal" id="passwordModal">
        <div class="modal-content">
            <h3 class="text-xl font-bold mb-4">魔王認證</h3>
            <input type="password" id="adminPwd" class="form-input w-full p-3" placeholder="請輸入魔界密碼">
            <button class="request-btn" onclick="checkPwd()">進入後台</button>
        </div>
    </div>

    <div id="toast" class="toast fixed top-5 left-1/2 -translate-x-1/2 p-3 px-8 rounded-full hidden z-[5000]"></div>

    <script>
        // 這裡放原本的 Firebase 設定與 JavaScript 邏輯
        // ... (保持原本的 JS 內容，功能將完美運作)
        // 只需要注意 showToast 功能要能抓到對應的 ID
        const firebaseConfig = {
            apiKey: "AIzaSyAZr1jc23-EdgzDxUVMdRn-ROZ8ZWS_L5k",
            authDomain: "vtuber-ktv.firebaseapp.com",
            projectId: "vtuber-ktv",
            storageBucket: "vtuber-ktv.firebasestorage.app",
            messagingSenderId: "570327519718",
            appId: "1:570327519718:web:0db4c15b94e7cad34a0627",
            databaseURL: "https://vtuber-ktv-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let songs = []; let queue = []; let currentFilter = 'all'; let searchQuery = ''; let isManagementMode = false; let selectedSong = null;
        db.ref('songs').on('value', snap => { const val = snap.val(); songs = val ? Object.keys(val).map(k => ({...val[k], id: k})) : []; render(); });
        db.ref('queue').on('value', snap => { const val = snap.val(); queue = val ? Object.keys(val).map(k => ({...val[k], id: k})) : []; render(); });
        function render() { renderAudienceSongs(); renderAudienceQueue(); renderDoneList(); if(isManagementMode) { renderAdminSongs(); renderAdminQueue(); } }
        function renderAudienceSongs() {
            const grid = document.getElementById('songsGrid');
            let filtered = songs.filter(s => !s.hidden);
            if(currentFilter !== 'all') filtered = filtered.filter(s => s.tags && s.tags.includes(currentFilter));
            if(searchQuery) { const q = searchQuery.toLowerCase(); filtered = filtered.filter(s => s.name.toLowerCase().includes(q) || (s.artist && s.artist.toLowerCase().includes(q))); }
            grid.innerHTML = filtered.map(s => `
                <div class="song-card">
                    <div>
                        <div class="song-name">${s.name}</div>
                        <div class="text-gray-400 text-sm mb-2">${s.artist || '魔界佚名'}</div>
                        <div class="flex gap-1 mb-2">${(s.tags || []).map(t => `<span class="px-2 py-0.5 bg-pink-50 text-pink-300 text-[10px] rounded-full">${t}</span>`).join('')}</div>
                        <div class="text-[10px] text-gray-500">🌌 獻祭次數：${s.count || 0}</div>
                    </div>
                    <button class="request-btn" onclick="openRequestModal('${s.id}')">獻上此曲 ♪</button>
                </div>
            `).join('');
        }
        function renderAudienceQueue() {
            const list = document.getElementById('queueList');
            const active = queue.filter(q => q.status !== 'completed');
            if(active.length === 0) { list.innerHTML = "目前沒有靈魂在排隊唷，快來點一首！"; return; }
            list.innerHTML = active.map((q, i) => `
                <div class="flex justify-between items-center bg-white/5 p-4 rounded-xl border border-white/10">
                    <div>
                        <span class="font-bold text-pink-300 mr-2">#${i+1}</span>
                        <span class="font-medium text-white">${q.songName}</span>
                        <span class="text-xs text-gray-500 ml-2">by ${q.requester}</span>
                    </div>
                    <div class="${q.status==='singing' ? 'status-singing' : 'text-xs text-gray-500'}">
                        ${q.status==='singing' ? '正在發送羊鳴 🎤' : '待機中'}
                    </div>
                </div>
            `).join('');
        }
        function renderDoneList() {
            const list = document.getElementById('doneList');
            const done = queue.filter(q => q.status === 'completed');
            if(done.length === 0) { list.innerHTML = "<div class='col-span-full text-center'>今日尚未有獻祭紀錄</div>"; return; }
            list.innerHTML = done.map(q => `<div class="bg-white/5 p-2 rounded border border-white/5 truncate">🌙 ${q.songName}</div>`).join('');
        }
        function openRequestModal(id) { selectedSong = songs.find(s => s.id === id); document.getElementById('targetSongName').innerText = selectedSong.name; document.getElementById('requestModal').classList.add('active'); }
        document.getElementById('confirmRequestBtn').onclick = () => {
            const name = document.getElementById('requesterName').value;
            if(!name) { alert('請留下靈魂真名！'); return; }
            db.ref('queue').push({ songId: selectedSong.id, songName: selectedSong.name, requester: name, message: document.getElementById('requestMsg').value, status: 'queued', time: Date.now() });
            closeModals(); showToast('點歌成功，咩花糖收到你的供品了！');
        };
        function renderAdminQueue() {
            const active = queue.filter(q => q.status !== 'completed');
            document.getElementById('adminQueueList').innerHTML = active.map(q => `
                <div class="p-4 bg-purple-900/30 rounded-xl border border-purple-500/50">
                    <div class="flex justify-between font-bold text-purple-200">
                        <span>${q.songName}</span>
                        <span class="text-xs text-purple-400">by ${q.requester}</span>
                    </div>
                    <div class="mt-2 text-sm bg-black/40 p-2 rounded text-gray-300 italic">💬 悄悄話：${q.message || '（無）'}</div>
                    <div class="mt-3 flex gap-2">
                        <button class="flex-1 bg-purple-500 text-white py-2 rounded-lg text-xs font-bold" onclick="db.ref('queue/${q.id}').update({status:'singing'})">開始唱</button>
                        <button class="flex-1 bg-yellow-600 text-white py-2 rounded-lg text-xs font-bold" onclick="completeSong('${q.id}', '${q.songId}')">唱完囉</button>
                        <button class="bg-gray-800 text-gray-500 px-3 py-2 rounded-lg text-xs" onclick="db.ref('queue/${q.id}').remove()">移除</button>
                    </div>
                </div>
            `).join('');
        }
        function completeSong(queueId, songId) { db.ref('queue/' + queueId).update({ status: 'completed' }); if(songId) { db.ref('songs/' + songId + '/count').transaction(c => (c || 0) + 1); } }
        function renderAdminSongs() {
            document.getElementById('adminSongsList').innerHTML = songs.map(s => `
                <div class="flex justify-between p-2 border-b border-gray-800 hover:bg-white/5 items-center ${s.hidden ? 'opacity-40' : ''}">
                    <span class="text-gray-300">${s.name} <small class="text-gray-500">(${s.artist || '無'})</small></span>
                    <div class="flex gap-2">
                        <button class="text-[10px] px-2 py-1 rounded border border-gray-600 text-gray-400" onclick="db.ref('songs/${s.id}').update({hidden:${!s.hidden}})">${s.hidden ? '🙈' : '👁️'}</button>
                        <button class="text-red-900 text-xs" onclick="if(confirm('確定刪除？')) db.ref('songs/${s.id}').remove()">❌</button>
                    </div>
                </div>
            `).join('');
        }
        function saveSong() {
            const name = document.getElementById('editName').value;
            const artist = document.getElementById('editArtist').value;
            const tags = Array.from(document.querySelectorAll('.tag-checkbox:checked')).map(el => el.value);
            if(!name) return;
            db.ref('songs').push({ name, artist, tags, count: 0 });
            document.getElementById('editName').value = ''; document.getElementById('editArtist').value = '';
            closeModals();
        }
        document.getElementById('searchInput').oninput = e => { searchQuery = e.target.value; renderAudienceSongs(); };
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active'); currentFilter = this.dataset.filter; renderAudienceSongs();
            };
        });
        function toggleMode() { document.getElementById('passwordModal').classList.add('active'); }
        function checkPwd() {
            if(document.getElementById('adminPwd').value === 'pmdmnmkz4') {
                isManagementMode = true;
                document.getElementById('managementView').style.display = 'block';
                document.getElementById('audienceView').style.display = 'none';
                closeModals(); render();
            } else { alert('密碼錯誤'); }
        }
        function openSongModal() { document.getElementById('songEditModal').classList.add('active'); }
        function closeModals() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }
        function showToast(txt) {
            const t = document.getElementById('toast');
            t.innerText = txt; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }
        function clearDoneQueue() { if(confirm('清除紀錄？')) { queue.filter(q => q.status === 'completed').forEach(i => db.ref('queue/' + i.id).remove()); } }
        function forceUpdate() { render(); showToast('數據已刷新'); }
    </script>
</body>
</html>
